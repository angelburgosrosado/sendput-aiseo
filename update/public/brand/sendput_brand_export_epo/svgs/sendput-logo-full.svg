<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" fill="none">
  <defs>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00FF66" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#080C14"/>
  <!-- Terminal Prompt Icon -->
  <g transform="translate(30, 35)">
    <rect width="80" height="80" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <path d="M 22 22 L 12 22 L 12 58 L 22 58" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 58 22 L 68 22 L 68 58 L 58 58" stroke="#FF6B00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 26 33 L 38 40 L 26 47" stroke="#00FF66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGreen)"/>
    <line x1="44" y1="48" x2="54" y2="48" stroke="#00FF66" stroke-width="5" stroke-linecap="round" filter="url(#glowGreen)"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(135, 88)">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">Sendput</text>
    <text x="195" y="0" fill="#FF6B00" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="800">[</text>
    <text x="218" y="0" fill="#FFFFFF" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="44" font-weight="700">com</text>
    <text x="298" y="0" fill="#FF6B00" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="48" font-weight="800">]</text>
  </g>
  <!-- Subtitle -->
  <text x="138" y="124" fill="#00FF66" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="1.8">EPO ENGINE • ENTITY PRESENCE OPTIMIZATION</text>
