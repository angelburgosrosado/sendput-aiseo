# render.yaml — Render Blueprint for SendPut EPO Engine PLG SaaS & White-Label Engine
services:
  - type: web
    name: sendput-ai-epo-engine
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Connect to Neon (ep-winter-poetry-ae51hoth) or VPS Postgres (34.148.244.49:5432)
      - key: VPS_POSTGRES_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRODUCT_ONESHOT_29
        value: prod_VVZcNbGZHG46T1
      - key: STRIPE_PRODUCT_STARTER_39
        value: prod_VVZfdwEubbbA2G
      - key: STRIPE_PRODUCT_GROWTH_79
        value: prod_VVZgJ0BGZz8r51
      - key: STRIPE_PRODUCT_AGENCY_299
        value: prod_VVZhif3ZHILKAZ
      - key: INDEXNOW_API_KEY
        value: sendput-indexnow-verified-key-2026
