version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: signalforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge_secret
      POSTGRES_DB: signalforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge -d signalforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signalforge-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://signalforge:signalforge_secret@db:5432/signalforge_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=signalforge-production-grade-mock-secret-key-32chars
      - SIGNALFORGE_ENV=production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
