name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://signalforge:signalforge_secret@localhost:5432/signalforge_db?schema=public"
      DIRECT_URL: "postgresql://signalforge:signalforge_secret@localhost:5432/signalforge_db?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "signalforge-ci-secret-key-32chars-min-length"
      SIGNALFORGE_ENV: "test"
      ENABLE_DEMO_SEED: "false"
      USE_MOCK_FALLBACK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Run Linter
        run: bun run lint

      - name: Run Unit & Integration Tests
        run: bun run test

      - name: Build Next.js Application
        run: bun run build
