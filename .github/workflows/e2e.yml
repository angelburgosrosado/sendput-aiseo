name: Playwright E2E Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - 'app/**'
      - 'components/**'
      - 'playwright.config.ts'

jobs:
  test-e2e:
    name: Playwright Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://signalforge:signalforge_secret@localhost:5432/signalforge_db?schema=public"
      DIRECT_URL: "postgresql://signalforge:signalforge_secret@localhost:5432/signalforge_db?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "signalforge-ci-secret-key-32chars-min-length"
      SIGNALFORGE_ENV: "test"
      ENABLE_DEMO_SEED: "true"
      USE_MOCK_FALLBACK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: bun run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
